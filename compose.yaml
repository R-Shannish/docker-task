services:
  app:
    build:
      context: ./app
    restart: always
    volumes:
      - app-data:/data
    expose:
      - "3000"

  nginx:
    image: nginx:stable
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app-data:
